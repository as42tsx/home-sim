<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Sim · 3D 调试</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23e4dccd'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: var(--sky-day-bottom, #e4dccd); color: var(--ink-1, #2b2620); font: 13px/1.4 var(--font-ui, sans-serif); }
    #view { position: fixed; inset: 0; }
    #bar { position: fixed; z-index: 2; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 16px); }
    button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-2, #cfc5b4); background: var(--paper-1, #fbf8f3); color: inherit; }
    button[aria-pressed="true"] { background: var(--accent, #a1542c); color: var(--ink-inverse, #fbf8f3); border-color: transparent; }
    #hud { position: fixed; z-index: 2; right: 8px; top: 8px; width: min(380px, 48vw); max-height: 72vh; overflow: auto; margin: 0; padding: 8px 10px; background: rgba(251, 248, 243, 0.9); border-radius: 8px; white-space: pre-wrap; font: 11px/1.35 ui-monospace, monospace; }
    #status { position: fixed; z-index: 2; left: 8px; bottom: 8px; margin: 0; padding: 6px 8px; background: rgba(251, 248, 243, 0.9); border-radius: 8px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/three.module.js",
      "three/addons/": "../vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="bar">
    <button id="btn-enter" type="button">进入 3D</button>
    <button id="btn-exit" type="button">退出</button>
    <button id="btn-cutaway" type="button" aria-pressed="false">剖切</button>
    <button id="btn-walk" type="button" aria-pressed="false">行走</button>
    <button id="btn-recolor" type="button">改一件颜色</button>
    <button id="btn-png" type="button">导出 PNG</button>
  </div>
  <pre id="hud">正在加载…</pre>
  <p id="status"></p>
  <script type="module" src="./view3d.js"></script>
</body>
</html>
